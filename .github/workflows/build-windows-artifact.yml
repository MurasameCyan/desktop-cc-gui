name: Diagnose Windows test loader

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact application commit to diagnose
        required: true
        default: 2bee63bb00c20b2508e92e161ee513b0ce66fa21

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: app
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install PE inspection tool
        run: python -m pip install pefile==2024.8.26
      - name: Run unchanged Rust library tests
        id: baseline
        working-directory: app
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Inspect imports and apply manifest-only experiment
        if: ${{ failure() && steps.baseline.outcome == 'failure' }}
        run: python probe/.github/scripts/windows-loader-probe.py app loader-evidence
      - name: Run same tests after manifest-only experiment
        if: ${{ failure() && steps.baseline.outcome == 'failure' }}
        working-directory: app
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-loader-evidence
          path: loader-evidence/
          if-no-files-found: warn
          retention-days: 3
