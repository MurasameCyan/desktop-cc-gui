name: Build Windows artifact

on:
  # A full Windows Tauri build costs 20–40 min of runner time — only run
  # manually via workflow_dispatch when an artifact is actually needed.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend and plugin behavior tests
        run: pnpm exec vitest run

      - name: Plugin typecheck
        run: pnpm --filter @ccgui/plugin-unified-provider typecheck

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Compile native test and smoke harnesses
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --tests --examples

      - name: Build independent provider plugin
        shell: pwsh
        run: |
          $env:CCGUI_PLUGIN_SDK_VERSION = (Get-Content packages/plugin-sdk/package.json -Raw | ConvertFrom-Json).version
          pnpm --filter @ccgui/plugin-unified-provider build

      - name: Disable updater signing for artifact build
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Build unsigned Windows installer
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: ccgui-windows-x64
          path: |
            src-tauri/target/release/ccgui-next.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ccgui-plugin-unified-provider
          path: |
            plugins/unified-provider/dist/manifest.json
            plugins/unified-provider/dist/main.js
            plugins/unified-provider/dist/styles.css
          if-no-files-found: error
